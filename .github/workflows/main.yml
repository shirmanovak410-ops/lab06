name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ rpm
      
      - name: Configure
        run: cmake -S . -B_build -DCMAKE_CXX_STANDARD=11
      
      - name: Build
        run: cmake --build _build
      
      - name: Create packages (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _build
          cpack -G "TGZ"
          cpack -G "DEB"
          cpack -G "RPM"
          cd ..
      
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/*.tar.gz
            _build/*.deb
            _build/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang rpm
      
      - name: Configure
        run: cmake -S . -B_build -DCMAKE_CXX_STANDARD=11 -DCMAKE_CXX_COMPILER=clang++
      
      - name: Build
        run: cmake --build _build
      
      - name: Create packages (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _build
          cpack -G "TGZ"
          cpack -G "DEB"
          cpack -G "RPM"
          cd ..
      
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/*.tar.gz
            _build/*.deb
            _build/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure
        run: cmake -S . -B_build -DCMAKE_CXX_STANDARD=11
      
      - name: Build
        run: cmake --build _build --config Release
      
      - name: Create packages (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd _build
          cpack -G "ZIP"
          cd ..
      
      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
