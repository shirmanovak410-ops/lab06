name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Check environment
      run: |
        echo "=== System info ==="
        uname -a
        which cmake || echo "CMake not in PATH"
        cmake --version || echo "CMake not installed"
        g++ --version

    - name: Configure CMake
      run: cmake -S . -B _build

    - name: Build
      run: cmake --build _build

    - name: Create package
      run: |
        cd _build
        cpack -G "TGZ"

    - name: Upload package
      uses: actions/upload-artifact@v3
      with:
        name: print-package
        path: _build/*.tar.gz
